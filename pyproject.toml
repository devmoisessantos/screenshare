[project]
name = "screenshare"
version = "1.2.0"
description = "Compartilhamento de tela ponto a ponto com áudio, chat e modos TCP + WebRTC"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Moises M Santos" }]
keywords = ["compartilhamento de tela", "screen sharing", "tkinter", "sockets", "webrtc", "python"]
dependencies = [
    "mss>=9.0.1",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
# Alternativa para ambientes antigos, caso o PortAudio nao esteja disponivel.
audio-legado = ["PyAudio>=0.2.13"]
webrtc = ["aiortc>=1.9.0", "aiohttp>=3.9.0"]
dev = ["pyinstaller>=6.0", "ruff>=0.6"]

[project.scripts]
screenshare = "principal:principal"

[tool.ruff]
target-version = "py39"
line-length = 95
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# Exceções amplas são intencionais nos módulos de mídia: bibliotecas nativas
# (mss, sounddevice, PyAudio) lançam erros específicos de cada sistema
# operacional e a
# aplicação precisa degradar de forma elegante em vez de encerrar.
# SIM105 (`contextlib.suppress`) fica desativado por legibilidade: em um projeto
# didático o bloco `try/except` explícito comunica melhor a intenção.
ignore = ["B008", "BLE001", "S110", "E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"testes/*" = ["S101"]
