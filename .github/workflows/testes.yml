name: Testes

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  testar:
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest]
        versao-python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.versao-python }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install mss opencv-python-headless numpy pillow

      - name: Rodar testes
        run: python -m unittest discover -s testes -p "teste_*.py" -v
